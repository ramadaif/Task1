<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doctor Appointment Form</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    background: #ffffff;
    color: #1a1a1a;
  }

  .page {
    width: 100vw;
    min-height: 100vh;
    margin: 0;
    padding: 40px 60px;
  }

  .container {
    display: flex;
    align-items: flex-start;
    width: 100%;
  }

  /* ---- Doctor image ---- */
  .doctor-image {
    flex: 0 0 38vw;
    width: 38vw;
    max-width: 800px;
  }

  .doctor-image img {
    width: 100%;
    display: block;
    object-fit: cover;
  }

  /* ---- Form section ---- */
  .form-wrapper {
    flex: 1;
    padding-left: 6vw;
    padding-top: 8vh;
    max-width: 900px;
  }

  .form-wrapper h1 {
    font-size: clamp(28px, 2.4vw, 42px);
    font-weight: 700;
    margin: 0 0 14px 0;
    line-height: 1.1;
  }

  .divider {
    border: none;
    border-top: 3px solid #e11d1d;
    width: 100%;
    max-width: 660px;
    margin: 0 0 36px 0;
  }

  form {
    display: table;
    border-collapse: separate;
    border-spacing: 0 26px;
    width: 100%;
  }

  .form-row {
    display: table-row;
  }

  .form-row .row-label {
    display: table-cell;
    width: 160px;
    padding-right: 24px;
    font-size: clamp(16px, 1.3vw, 22px);
    color: #1a1a1a;
    vertical-align: top;
    line-height: 1.25;
    white-space: nowrap;
  }

  .form-row .row-content {
    display: table-cell;
    vertical-align: middle;
  }

  /* ---- Inputs ---- */
  input[type="date"],
  input[type="time"],
  input[type="text"],
  input[type="tel"] {
    font-size: 1.05vw;
    padding: 10px 14px;
    border: 1px solid #2b2b2b;
    border-radius: 2px;
    font-family: inherit;
    color: #6b6b6b;
    height: 44px;
    background: #fff;
  }

  input::placeholder {
    color: #8a8a8a;
  }

  #appt-date {
    width: 260px;
  }

  #appt-time {
    width: 260px;
  }

  .name-fields,
  .address-fields {
    display: flex;
    gap: 30px;
  }

  .name-fields input,
  .address-fields input {
    width: 260px;
  }

  #phone {
    width: 260px;
  }

  .gender-options {
    display: flex;
    align-items: center;
    font-size: 1.1vw;
    height: 44px;
  }

  .gender-options input[type="radio"] {
    width: 17px;
    height: 17px;
    margin: 0 4px 0 0;
  }

  .gender-options label {
    margin-right: 14px;
    cursor: pointer;
  }

  #query {
    width: 100%;
    max-width: 460px;
    height: 100px;
    resize: vertical;
    border: 1px solid #2b2b2b;
    border-radius: 2px;
    font-family: inherit;
    font-size: 1.05vw;
    padding: 10px 14px;
  }

  .appointment-type-heading {
    font-size: 1vw;
    color: #1a1a1a;
    display: block;
    margin-bottom: 12px;
    white-space: nowrap;
  }

  .checkbox-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 1.1vw;
  }

  .checkbox-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .checkbox-list input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #1a56db;
    margin: 0;
  }

  #send-btn {
    background: #ececec;
    border: 1px solid #2b2b2b;
    padding: 12px 42px;
    font-size: 1.05vw;
    border-radius: 2px;
    cursor: pointer;
    color: #1a1a1a;
    font-family: inherit;
  }

  #send-btn:hover {
    background: #dcdcdc;
  }

  .send-row .row-content {
    padding-top: 8px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="container">
    <div class="doctor-image">
      <img src=images/dr.avif alt="Doctor in white coat with stethoscope">
    </div>

    <div class="form-wrapper">
      <h1>Doctor Appointment Form</h1>
      <hr class="divider">

      <form>
        <div class="form-row">
          <div class="row-label">Appointment<br>Date</div>
          <div class="row-content">
            <input type="date" id="appt-date" name="appt-date">
          </div>
        </div>

        <div class="form-row">
          <div class="row-label">Appointment<br>Time</div>
          <div class="row-content">
            <input type="time" id="appt-time" name="appt-time">
          </div>
        </div>

        <div class="form-row">
          <div class="row-label">Name</div>
          <div class="row-content">
            <div class="name-fields">
              <input type="text" placeholder="First" name="first-name">
              <input type="text" placeholder="Last" name="last-name">
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="row-label">Gender</div>
          <div class="row-content">
            <div class="gender-options">
              <input type="radio" id="male" name="gender" value="male">
              <label for="male">Male</label>
              <input type="radio" id="female" name="gender" value="female">
              <label for="female">Female</label>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="row-label">Phone</div>
          <div class="row-content">
            <input type="tel" id="phone" placeholder="####" name="phone">
          </div>
        </div>

        <div class="form-row">
          <div class="row-label">Address</div>
          <div class="row-content">
            <div class="address-fields">
              <input type="text" placeholder="city" name="city">
              <input type="text" placeholder="state" name="state">
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="row-label">Your Query</div>
          <div class="row-content">
            <textarea id="query" name="query"></textarea>
          </div>
        </div>

        <div class="form-row">
          <div class="row-label">Appointment<br>Type</div>
          <div class="row-content">
            <span class="appointment-type-heading">Select which appointment type(s) you require</span>
            <div class="checkbox-list">
              <label><input type="checkbox" name="appt-type" value="cervix" checked> Cervix checkup</label>
              <label><input type="checkbox" name="appt-type" value="heart" checked> Heart checkup</label>
              <label><input type="checkbox" name="appt-type" value="eye"> Eye check-up</label>
              <label><input type="checkbox" name="appt-type" value="hearing"> Hearing Test</label>
            </div>
          </div>
        </div>

        <div class="form-row send-row">
          <div class="row-label"></div>
          <div class="row-content">
            <button type="submit" id="send-btn">Send</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
